name: Build Electron Linux
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write   # needed by the release job

jobs:
  # x86_64 live ISOs for PCs (archiso)
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [minimal, desktop]
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - uses: actions/checkout@v5
      - name: Install archiso
        run: pacman -Syu --noconfirm archiso grub librsvg
      - name: Build graphical installer (Calamares, from AUR)
        if: matrix.variant == 'desktop'
        shell: bash
        run: |
          set -o pipefail
          bash ./build-aur.sh 2>&1 | tee build.log
      - name: Build ISO
        shell: bash
        run: |
          set -o pipefail
          BUILD_DIR=/tmp/build bash ./build.sh ${{ matrix.variant }} 2>&1 | tee build.log
      - name: Report failure reason
        if: failure()
        shell: bash
        run: |
          msg=$(tail -n 40 build.log | tr -d '\r' | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Build log (last 40 lines)::$msg"
      - uses: actions/upload-artifact@v4
        with:
          name: electron-linux-${{ matrix.variant }}
          path: out/*
          compression-level: 0

  # ARM64 disk images for UTM on Apple Silicon Macs (Arch Linux ARM based)
  build-arm:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        variant: [minimal, desktop]
    steps:
      - uses: actions/checkout@v5
      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y arch-install-scripts libarchive-tools gdisk dosfstools e2fsprogs qemu-utils
      - name: Build ARM64 image
        shell: bash
        run: |
          set -o pipefail
          sudo WORK_DIR=/tmp/arm-build bash ./build-arm.sh ${{ matrix.variant }} 2>&1 | tee build.log
      - name: Report failure reason
        if: failure()
        shell: bash
        run: |
          msg=$(tail -n 40 build.log | tr -d '\r' | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Build log (last 40 lines)::$msg"
      - uses: actions/upload-artifact@v4
        with:
          name: electron-linux-${{ matrix.variant }}-arm64-utm
          path: out/*
          compression-level: 0

  # On a v* tag: one release with all four versions attached
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, build-arm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Split files over GitHub's 2 GB asset limit
        run: |
          cd dist
          for f in *; do
            if [ "$(stat -c %s "$f")" -gt 2000000000 ]; then
              split -b 1900M -d -a 2 "$f" "$f.part"
              rm "$f"
            fi
          done
          ls -la
      - uses: softprops/action-gh-release@v2
        with:
          name: Electron Linux ${{ github.ref_name }}
          body_path: .github/release-notes.md
          files: dist/*
