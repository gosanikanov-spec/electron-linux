name: Build Electron Linux ISO
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [minimal, desktop]
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Install archiso
        run: pacman -Syu --noconfirm archiso
      - name: Build ISO
        run: BUILD_DIR=/tmp/build bash ./build.sh ${{ matrix.variant }}
      - uses: actions/upload-artifact@v4
        with:
          name: electron-linux-${{ matrix.variant }}
          path: out/*
          compression-level: 0
      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
