name: Build Electron Linux ISO
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [minimal, desktop]
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - uses: actions/checkout@v5
      - name: Install archiso
        run: pacman -Syu --noconfirm archiso grub
      - name: Build ISO
        shell: bash
        run: |
          set -o pipefail
          BUILD_DIR=/tmp/build bash ./build.sh ${{ matrix.variant }} 2>&1 | tee build.log
      - name: Report failure reason
        if: failure()
        shell: bash
        run: |
          msg=$(tail -n 40 build.log | tr -d '\r' | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Build log (last 40 lines)::$msg"
      - uses: actions/upload-artifact@v4
        with:
          name: electron-linux-${{ matrix.variant }}
          path: out/*
          compression-level: 0
      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
