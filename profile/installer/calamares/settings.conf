# Electron Linux — Calamares installer
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
  - id: cleanup
    module: shellprocess
    config: shellprocess_cleanup.conf
  - id: finalize
    module: shellprocess
    config: shellprocess_finalize.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - shellprocess@cleanup
      - users
      - networkcfg
      - hwclock
      - services-systemd
      - shellprocess@finalize
      - bootloader
      - umount
  - show:
      - finished

branding: electron
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
