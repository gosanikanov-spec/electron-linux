defaultGroups:
  - name: wheel
    must_exist: false
    system: true
  - name: audio
    must_exist: false
    system: true
  - name: video
    must_exist: false
    system: true
  - name: input
    must_exist: false
    system: true
sudoersGroup: wheel
autologinGroup: autologin
doAutologin: false
setRootPassword: true
doReusePassword: true
allowWeakPasswords: true
allowWeakPasswordsDefault: false
passwordRequirements:
  minLength: 1
  maxLength: -1
userShell: /bin/bash
hostname:
  location: EtcFile
  writeHostsFile: true
  template: "electron-${cpu}"
